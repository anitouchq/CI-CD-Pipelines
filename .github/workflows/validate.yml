name: Repository Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate project structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          for project in hello-rust hello-go hello-go-releases hello-python-releases hello-static hello-pages; do
            test -d "projects/$project"
            echo "Found projects/$project"
          done
          test -s README.md
          echo "Repository structure is valid."
